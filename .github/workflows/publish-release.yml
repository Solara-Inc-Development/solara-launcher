name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact verified version tag (for example V-0.0.14)'
        required: true
  push:
    tags:
      - 'V-*'

permissions:
  contents: write
concurrency:
  group: solara-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signed installer and exact corresponding source
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: node scripts/prepare-github-release.mjs "$VERSION" release-assets
      - name: Publish immutable assets as latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            mkdir existing-assets
            for asset in solaralauncher.exe solaralauncher.exe.sig source.zip; do
              gh release download "$VERSION" --pattern "$asset" --dir existing-assets
              cmp "release-assets/$asset" "existing-assets/$asset"
            done
            gh release edit "$VERSION" --latest
          else
            gh release create "$VERSION" \
              release-assets/solaralauncher.exe \
              release-assets/solaralauncher.exe.sig \
              release-assets/source.zip \
              --verify-tag --latest \
              --title "Solara Launcher $VERSION" \
              --notes-file release-assets/release_notes.md
          fi
