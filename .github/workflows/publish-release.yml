name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. V-0.0.06)'
        required: true
        default: 'V-0.0.06'
  push:
    branches:
      - main
    tags:
      - 'V-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION=$(node -e "
              const fs = require('fs');
              let v = '';
              if (fs.existsSync('packages/shared/build.json')) {
                v = JSON.parse(fs.readFileSync('packages/shared/build.json', 'utf8')).publicVersion;
              } else if (fs.existsSync('builds/current-build.json')) {
                v = JSON.parse(fs.readFileSync('builds/current-build.json', 'utf8')).publicVersion;
              } else if (fs.existsSync('builds/releases.json')) {
                const rel = JSON.parse(fs.readFileSync('builds/releases.json', 'utf8')).releases;
                if (rel && rel.length) v = rel[rel.length - 1].publicVersion;
              }
              console.log(v || 'V-0.0.13');
            ")
          fi
          echo "Preparing GitHub Release for $VERSION..."
          
          # Fetch genuine signed executable and signature from official portal
          curl -fLO "https://app.solara-inc.in/builds/$VERSION/solaralauncher.exe" || true
          curl -fLO "https://app.solara-inc.in/builds/$VERSION/solaralauncher.exe.sig" || true
          git archive -o source.zip HEAD
          
          # Extract release notes from CHANGELOG.md
          python3 -c '
          import re, os
          version = os.environ.get("VERSION", "")
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = r"(##\s+.*?%s\b.*?)(?=\n##\s+|$)" % re.escape(version)
          match = re.search(pattern, changelog, re.S)
          if match:
              notes = match.group(1).strip()
          else:
              notes = f"# Solara Launcher {version}\n\nTesting preview release."
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n\n---\n### Verification & Signatures\n- **Installer**: `solaralauncher.exe`\n- **Minisign Signature**: `solaralauncher.exe.sig`\n- Official Portal: https://app.solara-inc.in\n")
          '
          
          ASSETS=()
          [ -f "solaralauncher.exe" ] && ASSETS+=("solaralauncher.exe")
          [ -f "solaralauncher.exe.sig" ] && ASSETS+=("solaralauncher.exe.sig")
          [ -f "source.zip" ] && ASSETS+=("source.zip")
          
          # Handle existing release cleanly without deletion errors
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists on GitHub."
            echo "Ensuring release notes and assets are up to date..."
            gh release edit "$VERSION" --title "Solara Launcher $VERSION" --notes-file release_notes.md || true
            if [ ${#ASSETS[@]} -gt 0 ]; then
              gh release upload "$VERSION" "${ASSETS[@]}" --clobber || true
            fi
            echo "Release $VERSION verified and up to date."
          else
            echo "Creating new official release $VERSION as latest..."
            if ! gh release create "$VERSION" "${ASSETS[@]}" \
              --title "Solara Launcher $VERSION" \
              --notes-file release_notes.md \
              --latest; then
              echo "Release creation encountered conflict, updating existing release..."
              gh release edit "$VERSION" --title "Solara Launcher $VERSION" --notes-file release_notes.md || true
              if [ ${#ASSETS[@]} -gt 0 ]; then
                gh release upload "$VERSION" "${ASSETS[@]}" --clobber || true
              fi
            fi
            echo "Release $VERSION published successfully."
          fi
