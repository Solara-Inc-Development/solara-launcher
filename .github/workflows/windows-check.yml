name: Check Windows source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-check.yml'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'public/**'
      - '*Cargo*'
      - 'package*.json'
      - '*config*'
      - '*.html'

# Compile/test only: no signing credentials, release writes or uploaded binaries.
permissions:
  contents: read
concurrency:
  group: solara-windows-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '12.11.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the direct Node Tauri CLI used by packaging
        run: node node_modules/@tauri-apps/cli/tauri.js --version
      - name: Test shared logic, types and production frontend
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @modrinth/app-frontend build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check actual Windows desktop shell
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $checkLog = Join-Path $env:RUNNER_TEMP 'solara-native-check.log'
          cargo check -p theseus_gui --all-targets --locked 2>&1 | Tee-Object -FilePath $checkLog
          $checkExit = $LASTEXITCODE
          if ($checkExit -ne 0) {
            # This job has no app/signing/provider secrets. Expose bounded compiler
            # diagnostics as job annotations, readable with public repository access.
            $tail = (Get-Content $checkLog -Tail 80) -join "`n"
            if ($tail.Length -gt 12000) { $tail = $tail.Substring($tail.Length - 12000) }
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows native compiler diagnostics::$tail"
            exit $checkExit
          }
      - name: Run launcher-core and updater tests
        run: |
          cargo test -p theseus --lib --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p theseus_gui --bin solaralauncher --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record verification boundary
        if: always()
        run: |
          @'
          ## Windows source verification
          This job checks Windows compilation and runs local unit tests. Read each step's result above.
          It does not package/upload an installer, reserve a public build number, or use signing keys.
          Installer distribution remains gated by licence review and signing setup in the packaging workflow.
          Licensed Minecraft launch, Credential Manager persistence, login and installed UI acceptance need separate real-device tests.
          '@ >> $env:GITHUB_STEP_SUMMARY
