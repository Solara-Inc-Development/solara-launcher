name: Verify and package Windows
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: solara-windows-build-allocation
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    env:
      SOLARA_CLIENT_ID: ${{ vars.SOLARA_CLIENT_ID }}
      SOLARA_MICROSOFT_CLIENT_ID: ${{ vars.SOLARA_MICROSOFT_CLIENT_ID }}
      SOLARA_DISCORD_CLIENT_ID: ${{ vars.SOLARA_DISCORD_CLIENT_ID }}
      SOLARA_UPDATER_PUBLIC_KEY: ${{ vars.SOLARA_UPDATER_PUBLIC_KEY }}
      VITE_SOLARA_GITHUB_URL: https://github.com/${{ github.repository }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release prerequisites before any version reservation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const review=JSON.parse(readFileSync('docs/upstream-license-review.json','utf8'));
          const missing=[];
          const migration=JSON.parse(readFileSync('docs/engine-migration.json','utf8'));
          if(migration.status!=='ready'||migration.inheritedEngineRemoved!==true||migration.windowsAcceptance!==true)missing.push('Complete independent engine replacement and Windows acceptance.');
          if(review.status!=='cleared'||!review.evidence?.length)missing.push('Resolve and document the upstream dependency licence review.');
          for(const key of ['TAURI_SIGNING_PRIVATE_KEY','SOLARA_UPDATER_PUBLIC_KEY'])if(!process.env[key])missing.push(`Configure ${key} in repository secrets/variables.`);
          if(missing.length){for(const message of missing)console.error(message);process.exit(1)}
          console.log('Release prerequisites are present; version reservation may proceed after checks.');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Fetch pinned engine and apply Solara patches
        env:
          SOLARA_UPSTREAM_CACHE: ${{ runner.temp }}/solara-upstream-cache
        run: python scripts/prepare-upstream.py
      - name: Test shared logic and UI types
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test local server logic
        run: cargo test -p solara-local-server --locked
      - name: Reserve unique public version (draft release)
        run: node scripts/release.mjs reserve --github
      - name: Package signed updater artifacts
        run: node scripts/release.mjs package
      - name: Stage and verify immutable executable
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one generated NSIS installer" }
          node scripts/release.mjs stage $installers[0].FullName CHANGELOG.md target/release/solaralauncher.exe
      - name: Preserve completed builds and consumed version reservation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solara-windows-${{ github.run_id }}
          path: |
            builds/
            packages/shared/build.json
          if-no-files-found: error
          retention-days: 90
# Publish is deliberate: download staged archive to SAME-VPS builds/, upload immutable
# executable/signature, then publish-manifest only after actual public bytes verify.
# GitHub draft reservations are kept even on failure; do not reuse their numbers.
