[package]
name = "solara-launcher"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
build = "build.rs"

[lib]
name = "solara_launcher"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "solaralauncher"
path = "src/main.rs"
required-features = ["desktop-shell"]

[features]
default = ["desktop-shell"]
desktop-shell = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-updater", "dep:tauri-plugin-process"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
dirs = "6"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1_smol = { version = "1", features = ["std"] }
solara-local-server = { path = "../../packages/local-server" }
tauri = { version = "=2.12.5", optional = true }
tauri-plugin-opener = { version = "=2.7.2", optional = true }
tauri-plugin-updater = { version = "=2.14.1", optional = true }
tauri-plugin-process = { version = "=2.4.0", optional = true }
theseus = { path = "../../.upstream/modrinth/packages/app-lib" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
discord-rich-presence = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
