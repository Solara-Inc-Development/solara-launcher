<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Solara Launcher</title>
  <desc id="description">An original vector banner on black with a large white wordmark, the Solara ring and lightning mark, and four small colour accents.</desc>
  <rect width="1440" height="460" rx="28" fill="#000"/>
  <rect x=".5" y=".5" width="1439" height="459" rx="27.5" stroke="#242424"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="68" y="63" fill="#CBCBCB" font-size="13" font-weight="700" letter-spacing="2.6">SOLARA INC.</text>
    <path d="M189 49V65" stroke="#4A4A4A"/>
    <text x="207" y="63" fill="#B6B6B6" font-size="13" letter-spacing="1.6">YOUR DESKTOP, A LITTLE BETTER.</text>
    <text x="61" y="209" fill="#FFF" font-size="132" font-weight="700" letter-spacing="-7">Solara</text>
    <text x="61" y="333" fill="#FFF" font-size="132" font-weight="700" letter-spacing="-7">Launcher<tspan fill="#B7A5FF">.</tspan></text>
    <text x="69" y="386" fill="#B9B9B9" font-size="21">Your worlds. Your services. Right here.</text>
    <text x="1332" y="63" text-anchor="end" fill="#B6B6B6" font-size="12" letter-spacing="1.9">MINECRAFT JAVA / WINDOWS</text>
  </g>
  <!-- The existing Solara mark, drawn as flat strokes; no generated artwork. -->
  <rect x="1016" y="110" width="260" height="260" rx="64" fill="#000" stroke="#303030" stroke-width="2"/>
  <circle cx="1146" cy="240" r="75" stroke="#7BD8F2" stroke-width="18"/>
  <path d="M1102 253H1146L1133 288L1190 235H1146L1159 200Z" fill="#FFC17B"/>
  <path d="M69 430H385" stroke="#B7A5FF" stroke-width="3" stroke-linecap="round"/>
  <path d="M405 430H721" stroke="#7BD8F2" stroke-width="3" stroke-linecap="round"/>
  <path d="M741 430H1057" stroke="#FFC17B" stroke-width="3" stroke-linecap="round"/>
  <path d="M1077 430H1371" stroke="#79D6B2" stroke-width="3" stroke-linecap="round"/>
</svg>
