<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Solara Launcher — fast, clean Minecraft Java launcher for Windows">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="50%" stop-color="#050a14"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#0ea5e9" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="goldOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="solaraBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="52%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="textShimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="65%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animate attributeName="x1" values="-100%;100%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="200%;400%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="railBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="360" rx="24"/>
    </clipPath>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="360" fill="url(#bgGrad)"/>

    <g stroke="#38bdf8" stroke-opacity="0.045" stroke-width="1">
      <path d="M0 72 H1200 M0 144 H1200 M0 216 H1200 M0 288 H1200"/>
      <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360"/>
    </g>

    <circle cx="310" cy="145" r="260" fill="url(#cyanOrb)">
      <animate attributeName="cx" values="280;380;280" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="135;190;135" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="210" r="240" fill="url(#goldOrb)">
      <animate attributeName="cx" values="920;810;920" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="215;155;215" dur="10s" repeatCount="indefinite"/>
    </circle>

    <g fill="#7dd3fc">
      <circle cx="165" cy="95" r="2.2" opacity="0.6">
        <animate attributeName="cy" values="105;72;105" dur="5.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="5.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="245" cy="255" r="1.8" opacity="0.45">
        <animate attributeName="cy" values="265;230;265" dur="6.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.75;0.15" dur="6.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="92" r="2.4" fill="#fde68a" opacity="0.65">
        <animate attributeName="cy" values="104;68;104" dur="5.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1055" cy="245" r="2" fill="#fbbf24" opacity="0.5">
        <animate attributeName="cy" values="258;222;258" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="835" cy="70" r="1.6" opacity="0.5">
        <animate attributeName="cy" values="80;52;80" dur="4.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(600, 96)">
      <animateTransform attributeName="transform" type="translate" values="600 98;600 88;600 98" dur="4s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="46" fill="none" stroke="url(#solaraBrand)" stroke-width="1.5" opacity="0.35">
        <animate attributeName="r" values="42;52;42" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <rect x="-36" y="-36" width="72" height="72" rx="18" fill="#09111e" stroke="url(#solaraBrand)" stroke-width="2.2" filter="url(#softGlow)"/>
      <circle cx="0" cy="0" r="21" fill="none" stroke="url(#solaraBrand)" stroke-width="3.2"/>
      <path d="M2 -13 L-9 2 H0 L-2 13 L9 -2 H0 Z" fill="url(#solaraBrand)"/>
    </g>

    <g transform="translate(600, 162)">
      <rect x="-126" y="-12" width="252" height="24" rx="12" fill="#0c1829" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="1"/>
      <circle cx="-104" cy="0" r="3.5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="6" y="4" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.2">SOLARA-INC · WINDOWS</text>
    </g>

    <text x="600" y="232" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.2">
      <tspan fill="#f8fafc">Solara </tspan>
      <tspan fill="url(#textShimmer)">Launcher</tspan>
    </text>

    <text x="600" y="270" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="500">
      A clean, fast Minecraft Java launcher — built with OLED &amp; White themes, 3D Skin Studio, and zero clutter.
    </text>

    <rect x="0" y="355" width="1200" height="5" fill="#0f172a"/>
    <rect x="-360" y="355" width="420" height="5" fill="url(#railBeam)">
      <animate attributeName="x" values="-420;1200" dur="3.8s" repeatCount="indefinite"/>
    </rect>

    <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>
  </g>
</svg>
