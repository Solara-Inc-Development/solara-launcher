<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Solara Launcher highlights: 3D Skin Studio, Solara Downloads, Background Auto-Updates, OLED and White themes">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
  </defs>

  <!-- Card 1: 3D Skin Studio -->
  <g transform="translate(8, 10)">
    <rect width="282" height="200" rx="18" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="18" y="18" width="246" height="92" rx="12" fill="#03050a" stroke="#38bdf8" stroke-opacity="0.18"/>
    <!-- Animated blocky Steve silhouette waving -->
    <g transform="translate(141, 66)">
      <animateTransform attributeName="transform" type="translate" values="141 68;141 62;141 68" dur="2.8s" repeatCount="indefinite"/>
      <!-- Head -->
      <rect x="-11" y="-34" width="22" height="22" rx="3" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Body -->
      <rect x="-10" y="-10" width="20" height="24" rx="2.5" fill="#60a5fa" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1.5"/>
      <!-- Left arm -->
      <rect x="-18" y="-10" width="6" height="20" rx="2" fill="#38bdf8" fill-opacity="0.28"/>
      <!-- Right waving arm -->
      <g transform="translate(13, -8)">
        <rect x="0" y="-2" width="6" height="20" rx="2" fill="#fbbf24" fill-opacity="0.85">
          <animateTransform attributeName="transform" type="rotate" values="-145 3 2;-110 3 2;-145 3 2" dur="1.6s" repeatCount="indefinite"/>
        </rect>
      </g>
      <!-- Legs -->
      <rect x="-9" y="16" width="8" height="16" rx="2" fill="#38bdf8" fill-opacity="0.35"/>
      <rect x="1" y="16" width="8" height="16" rx="2" fill="#38bdf8" fill-opacity="0.35"/>
    </g>
    <text x="20" y="140" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">3D Skin Studio</text>
    <text x="20" y="163" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">Custom .PNG uploader, capes, and</text>
    <text x="20" y="181" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">6 live poses (Wave, Sit, Jump, Salute).</text>
  </g>

  <!-- Card 2: Solara Downloads -->
  <g transform="translate(309, 10)">
    <rect width="282" height="200" rx="18" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="18" y="18" width="246" height="92" rx="12" fill="#03050a" stroke="#38bdf8" stroke-opacity="0.18"/>
    <!-- Live animated download card preview -->
    <rect x="32" y="34" width="218" height="60" rx="10" fill="#0d1522"/>
    <rect x="44" y="45" width="24" height="24" rx="7" fill="#38bdf8" fill-opacity="0.18"/>
    <path d="M56 51 V62 M52 58 L56 62 L60 58" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="78" y="47" width="86" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="172" y="45" width="64" height="11" rx="5.5" fill="#38bdf8" fill-opacity="0.18"/>
    <text x="204" y="53.5" text-anchor="middle" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="700">Downloading</text>
    <!-- Progress track -->
    <rect x="44" y="79" width="194" height="6" rx="3" fill="#1e293b"/>
    <rect x="44" y="79" width="60" height="6" rx="3" fill="url(#accent)">
      <animate attributeName="width" values="28;188;188;28" keyTimes="0;0.75;0.9;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="20" y="140" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Solara Downloads</text>
    <text x="20" y="163" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">Track Java, modpacks, and updates</text>
    <text x="20" y="181" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">live with Active &amp; History tabs.</text>
  </g>

  <!-- Card 3: Auto-Updates -->
  <g transform="translate(610, 10)">
    <rect width="282" height="200" rx="18" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="18" y="18" width="246" height="92" rx="12" fill="#03050a" stroke="#38bdf8" stroke-opacity="0.18"/>
    <!-- Animated shield + spinning ring -->
    <g transform="translate(141, 64)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="44 132" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="3s" repeatCount="indefinite"/>
      </circle>
      <path d="M-9 1 L-2 8 L10 -6" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="20" y="140" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Silent Auto-Updates</text>
    <text x="20" y="163" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">Minisign-verified downloads grab in</text>
    <text x="20" y="181" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">the background &amp; install on launch.</text>
  </g>

  <!-- Card 4: OLED & White Themes -->
  <g transform="translate(911, 10)">
    <rect width="282" height="200" rx="18" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="18" y="18" width="246" height="92" rx="12" fill="#03050a" stroke="#38bdf8" stroke-opacity="0.18"/>
    <!-- OLED mini preview -->
    <rect x="32" y="30" width="104" height="68" rx="9" fill="#000000" stroke="#38bdf8" stroke-width="1.4"/>
    <circle cx="84" cy="54" r="10" fill="#0c1829" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="60" y="72" width="48" height="4.5" rx="2.2" fill="url(#accent)"/>
    <!-- White mini preview -->
    <rect x="146" y="30" width="104" height="68" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
    <circle cx="198" cy="54" r="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="174" y="72" width="48" height="4.5" rx="2.2" fill="url(#accent)"/>
    <!-- Pulse indicator between cards -->
    <circle cx="141" cy="64" r="3" fill="#fbbf24">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="140" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">OLED &amp; White Themes</text>
    <text x="20" y="163" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">True pitch-black OLED or crisp</text>
    <text x="20" y="181" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">daylight White — zero visual noise.</text>
  </g>
</svg>
