<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Solara Launcher interactive feature showcase: 3D Skin Studio, Solara Downloads, Silent Auto-Updates, and OLED &amp; White Themes">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="52%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b111c"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <radialGradient id="stageCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="stageGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.26"/>
      <stop offset="65%" stop-color="#fbbf24" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shimmerBar" x1="-50%" y1="0%" x2="150%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#7dd3fc"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- ==================== CARD 1: 3D SKIN STUDIO ==================== -->
  <g transform="translate(8, 8)">
    <rect width="584" height="254" rx="22" fill="url(#cardSurface)" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Left Text + Pose Pills -->
    <g transform="translate(26, 28)">
      <rect width="98" height="24" rx="12" fill="#38bdf8" fill-opacity="0.14"/>
      <text x="49" y="15.5" text-anchor="middle" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">SKIN STUDIO</text>

      <text x="0" y="56" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800">3D Skin Customizer</text>
      <text x="0" y="82" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5">Drag &amp; drop any .PNG skin, toggle</text>
      <text x="0" y="102" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5">Classic or Slim arms, equip capes,</text>
      <text x="0" y="122" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5">and preview 6 live 3D poses.</text>

      <!-- Live cycling Pose Pills -->
      <g transform="translate(0, 148)">
        <rect x="0" y="0" width="66" height="26" rx="13" fill="#0c2238" stroke="#38bdf8" stroke-width="1.2">
          <animate attributeName="stroke-opacity" values="1;0.25;0.25;0.25;1" dur="6s" repeatCount="indefinite"/>
        </rect>
        <text x="33" y="17" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700">Wave</text>

        <rect x="74" y="0" width="54" height="26" rx="13" fill="#101827" stroke="#38bdf8" stroke-width="1.2">
          <animate attributeName="stroke-opacity" values="0.2;1;0.2;0.2;0.2" dur="6s" repeatCount="indefinite"/>
        </rect>
        <text x="101" y="17" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600">Sit</text>

        <rect x="136" y="0" width="66" height="26" rx="13" fill="#101827" stroke="#fbbf24" stroke-width="1.2">
          <animate attributeName="stroke-opacity" values="0.2;0.2;1;0.2;0.2" dur="6s" repeatCount="indefinite"/>
        </rect>
        <text x="169" y="17" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600">Jump</text>

        <rect x="210" y="0" width="70" height="26" rx="13" fill="#101827" stroke="#a78bfa" stroke-width="1.2">
          <animate attributeName="stroke-opacity" values="0.2;0.2;0.2;1;0.2" dur="6s" repeatCount="indefinite"/>
        </rect>
        <text x="245" y="17" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600">Salute</text>
      </g>

      <text x="0" y="198" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">Classic 4px · Slim 3px · Cape Vault included</text>
    </g>

    <!-- Right 3D Stage -->
    <g transform="translate(332, 20)">
      <rect width="232" height="214" rx="16" fill="#03060c" stroke="#38bdf8" stroke-opacity="0.2"/>
      <circle cx="116" cy="108" r="90" fill="url(#stageCyan)"/>

      <!-- Orbiting Pedestal Rings -->
      <g transform="translate(116, 174)">
        <ellipse cx="0" cy="0" rx="64" ry="15" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.3"/>
        <ellipse cx="0" cy="0" rx="46" ry="10.5" fill="none" stroke="#fbbf24" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="14 10">
          <animate attributeName="stroke-dashoffset" values="0;96" dur="4s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <!-- Detailed Animated Character -->
      <g transform="translate(116, 108)">
        <animateTransform attributeName="transform" type="translate" values="116 112;116 102;116 112" dur="2.8s" repeatCount="indefinite"/>

        <!-- Flowing Cape Behind -->
        <path d="M-16 -24 L16 -24 L22 36 L-22 36 Z" fill="#1d4ed8" fill-opacity="0.7" stroke="#60a5fa" stroke-opacity="0.45">
          <animate attributeName="d" values="M-16 -24 L16 -24 L22 36 L-22 36 Z;M-16 -24 L16 -24 L26 32 L-26 32 Z;M-16 -24 L16 -24 L22 36 L-22 36 Z" dur="2.8s" repeatCount="indefinite"/>
        </path>

        <!-- Head with hair + eyes -->
        <rect x="-19" y="-66" width="38" height="38" rx="5" fill="#e0b088" stroke="#1e293b" stroke-width="1.2"/>
        <path d="M-19 -66 H19 V-51 H13 V-57 H-13 V-51 H-19 Z" fill="#2d1e15"/>
        <rect x="-12" y="-48" width="7" height="5" rx="1" fill="#ffffff"/>
        <rect x="-9" y="-48" width="3.5" height="5" rx="0.8" fill="#0ea5e9"/>
        <rect x="5" y="-48" width="7" height="5" rx="1" fill="#ffffff"/>
        <rect x="5.5" y="-48" width="3.5" height="5" rx="0.8" fill="#0ea5e9"/>
        <rect x="-5" y="-37" width="10" height="3" rx="1.5" fill="#9a6445"/>

        <!-- Hoodie Torso -->
        <rect x="-18" y="-26" width="36" height="48" rx="4" fill="#0ea5e9"/>
        <rect x="-18" y="-26" width="36" height="48" rx="4" fill="#000000" fill-opacity="0.18"/>
        <rect x="-11" y="-17" width="22" height="26" rx="4" fill="#07111f"/>
        <path d="M1 -11 L-5 -3 H0 L-1 4 L5 -4 H0 Z" fill="#fbbf24"/>

        <!-- Left Arm -->
        <rect x="-30" y="-26" width="11" height="44" rx="3.5" fill="#0284c7"/>
        <rect x="-30" y="6" width="11" height="12" rx="3" fill="#e0b088"/>

        <!-- Right Waving Arm -->
        <g transform="translate(19, -22)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-148 5.5 4;-108 5.5 4;-148 5.5 4" dur="1.5s" repeatCount="indefinite"/>
            <rect x="0" y="-4" width="11" height="44" rx="3.5" fill="#0284c7"/>
            <rect x="0" y="28" width="11" height="12" rx="3" fill="#e0b088"/>
          </g>
        </g>

        <!-- Legs -->
        <rect x="-17" y="23" width="16" height="42" rx="3.5" fill="#1e293b"/>
        <rect x="1" y="23" width="16" height="42" rx="3.5" fill="#1e293b"/>
        <rect x="-17" y="56" width="16" height="9" rx="2.5" fill="#0f172a"/>
        <rect x="1" y="56" width="16" height="9" rx="2.5" fill="#0f172a"/>
      </g>
    </g>
  </g>

  <!-- ==================== CARD 2: SOLARA DOWNLOADS ==================== -->
  <g transform="translate(608, 8)">
    <rect width="584" height="254" rx="22" fill="url(#cardSurface)" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Left Header -->
    <g transform="translate(26, 26)">
      <rect width="108" height="24" rx="12" fill="#fbbf24" fill-opacity="0.14"/>
      <text x="54" y="15.5" text-anchor="middle" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">TRANSFERS</text>
      <text x="0" y="54" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800">Solara Downloads</text>
      <text x="0" y="79" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5">Live tracking for Java runtimes, modpacks,</text>
      <text x="0" y="99" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5">and installs — with Active &amp; History tabs.</text>
    </g>

    <!-- Realistic Solara Downloads Drawer UI -->
    <g transform="translate(26, 136)">
      <rect width="532" height="98" rx="16" fill="#050a14" stroke="#38bdf8" stroke-opacity="0.22"/>

      <!-- Segmented Tabs + Speed Chip -->
      <rect x="12" y="11" width="152" height="24" rx="8" fill="#0d1526"/>
      <rect x="15" y="14" width="74" height="18" rx="6" fill="#17253d"/>
      <text x="52" y="26.5" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700">Active (2)</text>
      <text x="126" y="26.5" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600">History</text>

      <rect x="438" y="12" width="82" height="22" rx="11" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="479" y="26.5" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">18.4 MB/s</text>

      <!-- Task Row 1: Modpack -->
      <g transform="translate(12, 42)">
        <rect width="250" height="44" rx="11" fill="#0d1626"/>
        <rect x="9" y="9" width="26" height="26" rx="8" fill="#38bdf8" fill-opacity="0.16"/>
        <path d="M22 15 V26 M18 22 L22 26 L26 22" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="43" y="20" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700">Fabulously Optimized</text>
        <text x="239" y="20" text-anchor="end" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="700">74%</text>
        <rect x="43" y="28" width="196" height="6" rx="3" fill="#1e293b"/>
        <rect x="43" y="28" width="120" height="6" rx="3" fill="url(#shimmerBar)">
          <animate attributeName="width" values="36;192;192;36" keyTimes="0;0.78;0.92;1" dur="4.6s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Task Row 2: Java 21 -->
      <g transform="translate(270, 42)">
        <rect width="250" height="44" rx="11" fill="#0d1626"/>
        <rect x="9" y="9" width="26" height="26" rx="8" fill="#fbbf24" fill-opacity="0.16"/>
        <circle cx="22" cy="22" r="6" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="14 24">
          <animateTransform attributeName="transform" type="rotate" values="0 22 22;360 22 22" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <text x="43" y="20" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700">Java 21 Runtime</text>
        <text x="239" y="20" text-anchor="end" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10" font-weight="700">58%</text>
        <rect x="43" y="28" width="196" height="6" rx="3" fill="#1e293b"/>
        <rect x="43" y="28" width="90" height="6" rx="3" fill="url(#shimmerBar)">
          <animate attributeName="width" values="18;168;168;18" keyTimes="0;0.74;0.9;1" dur="5.4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- ==================== CARD 3: SILENT AUTO-UPDATES ==================== -->
  <g transform="translate(8, 278)">
    <rect width="584" height="254" rx="22" fill="url(#cardSurface)" stroke="#1e293b" stroke-width="1.5"/>

    <g transform="translate(26, 26)">
      <rect width="114" height="24" rx="12" fill="#10b981" fill-opacity="0.14"/>
      <text x="57" y="15.5" text-anchor="middle" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">AUTO-UPDATER</text>
      <text x="0" y="54" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800">Silent Verified Updates</text>
      <text x="0" y="79" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5">New versions download quietly in the background, pass Minisign</text>
      <text x="0" y="99" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5">cryptographic checks, and auto-install cleanly on your next launch.</text>
    </g>

    <!-- Animated Pipeline Diagram -->
    <g transform="translate(26, 138)">
      <rect width="532" height="96" rx="16" fill="#050a14" stroke="#10b981" stroke-opacity="0.22"/>

      <!-- Connecting conduits -->
      <line x1="158" y1="48" x2="228" y2="48" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
      <line x1="306" y1="48" x2="376" y2="48" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

      <!-- Flowing glowing data packets -->
      <circle cx="158" cy="48" r="4.5" fill="#38bdf8">
        <animate attributeName="cx" values="158;228" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="306" cy="48" r="4.5" fill="#34d399">
        <animate attributeName="cx" values="306;376" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
      </circle>

      <!-- Node 1: GitHub CDN -->
      <rect x="18" y="20" width="140" height="56" rx="13" fill="#0d1626" stroke="#38bdf8" stroke-opacity="0.32"/>
      <text x="88" y="44" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">GitHub CDN</text>
      <text x="88" y="61" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">latest.json</text>

      <!-- Node 2: Minisign Verification Shield -->
      <g transform="translate(267, 48)">
        <circle cx="0" cy="0" r="32" fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45" stroke-width="1.5">
          <animate attributeName="r" values="30;35;30" dur="2.6s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.65;0.2;0.65" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <path d="M0 -18 L14 -12 V1 C14 10 7 16 0 20 C-7 16 -14 10 -14 1 V-12 Z" fill="#064e3b" stroke="#34d399" stroke-width="1.8"/>
        <path d="M-5.5 0.5 L-1.5 4.5 L6.5 -4.5" fill="none" stroke="#6ee7b7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Node 3: Ready on Launch -->
      <rect x="376" y="20" width="140" height="56" rx="13" fill="#0d1626" stroke="#fbbf24" stroke-opacity="0.35"/>
      <text x="446" y="44" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">Auto-Install</text>
      <text x="446" y="61" text-anchor="middle" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600">Instant on Launch</text>
    </g>
  </g>

  <!-- ==================== CARD 4: OLED &amp; WHITE THEMES ==================== -->
  <g transform="translate(608, 278)">
    <rect width="584" height="254" rx="22" fill="url(#cardSurface)" stroke="#1e293b" stroke-width="1.5"/>

    <g transform="translate(26, 26)">
      <rect width="124" height="24" rx="12" fill="#a78bfa" fill-opacity="0.14"/>
      <text x="62" y="15.5" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">CUSTOM THEMES</text>
      <text x="0" y="54" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800">OLED &amp; White Themes</text>
      <text x="0" y="79" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5">Pick true pitch-black OLED for night sessions or crisp daylight White</text>
      <text x="0" y="99" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5">— crafted cleanly in Settings → Theme with zero visual clutter.</text>
    </g>

    <!-- Twin Mini Window Previews -->
    <g transform="translate(26, 136)">
      <!-- OLED Mini Window -->
      <g>
        <rect width="254" height="102" rx="14" fill="#000000" stroke="#38bdf8" stroke-width="1.6"/>
        <rect width="254" height="18" rx="14" fill="#080d16"/>
        <rect y="9" width="254" height="9" fill="#080d16"/>
        <circle cx="14" cy="9" r="3.5" fill="#38bdf8"/>
        <rect x="24" y="7" width="44" height="4" rx="2" fill="#334155"/>
        <!-- Mini Sidebar -->
        <rect x="0" y="18" width="24" height="84" fill="#060a12"/>
        <rect x="6" y="25" width="12" height="12" rx="4" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
        <rect x="7" y="43" width="10" height="10" rx="3" fill="#1e293b"/>
        <!-- Center Mini Hero -->
        <circle cx="139" cy="52" r="34" fill="url(#stageCyan)"/>
        <rect x="128" y="27" width="22" height="22" rx="6" fill="#091324" stroke="url(#brandGrad)" stroke-width="1.2"/>
        <path d="M139.6 33.5 L136 38.5 H139 L138.4 43 L142 38 H139 Z" fill="url(#brandGrad)"/>
        <rect x="108" y="56" width="62" height="5.5" rx="2.75" fill="#f8fafc" fill-opacity="0.9"/>
        <rect x="119" y="66" width="40" height="5" rx="2.5" fill="url(#brandGrad)"/>
        <text x="139" y="90" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700">OLED · True Black</text>
      </g>

      <!-- Animated swap spark -->
      <circle cx="266" cy="51" r="4" fill="#fbbf24">
        <animate attributeName="r" values="3;5.5;3" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/>
      </circle>

      <!-- White Mini Window -->
      <g transform="translate(278, 0)">
        <rect width="254" height="102" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
        <rect width="254" height="18" rx="14" fill="#ffffff"/>
        <rect y="9" width="254" height="9" fill="#ffffff"/>
        <circle cx="14" cy="9" r="3.5" fill="#0284c7"/>
        <rect x="24" y="7" width="44" height="4" rx="2" fill="#cbd5e1"/>
        <!-- Mini Sidebar -->
        <rect x="0" y="18" width="24" height="84" fill="#f1f5f9"/>
        <rect x="6" y="25" width="12" height="12" rx="4" fill="#0284c7" fill-opacity="0.16" stroke="#0284c7" stroke-width="1"/>
        <rect x="7" y="43" width="10" height="10" rx="3" fill="#cbd5e1"/>
        <!-- Center Mini Hero -->
        <circle cx="139" cy="52" r="34" fill="url(#stageGold)"/>
        <rect x="128" y="27" width="22" height="22" rx="6" fill="#0f172a" stroke="url(#brandGrad)" stroke-width="1.2"/>
        <path d="M139.6 33.5 L136 38.5 H139 L138.4 43 L142 38 H139 Z" fill="url(#brandGrad)"/>
        <rect x="108" y="56" width="62" height="5.5" rx="2.75" fill="#0f172a" fill-opacity="0.9"/>
        <rect x="119" y="66" width="40" height="5" rx="2.5" fill="url(#brandGrad)"/>
        <text x="139" y="90" text-anchor="middle" fill="#0284c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700">White · Clean Daylight</text>
      </g>
    </g>
  </g>
</svg>
