# PREPARATION ONLY. Single main API on the EXISTING VPS using existing PHP 8.4 FPM.
# Put these limit_req_zone lines once in http{} after inspecting existing zone names.
# limit_req_zone $binary_remote_addr zone=solara_launcher_public:10m rate=30r/m;
# limit_req_zone $binary_remote_addr zone=solara_launcher_auth:10m rate=10r/m;
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.solara-inc.in;
    ssl_certificate /etc/letsencrypt/live/api.solara-inc.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.solara-inc.in/privkey.pem;
    client_max_body_size 64k;
    # Inspect DNS / Cloudflare real-IP conventions before enabling address-based quotas.
    # Never log authorization headers or native /token request bodies.
    location ^~ /v1/launcher/ {
        # limit_req zone=solara_launcher_public burst=15 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/solara-launcher-private/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location = /health {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/solara-launcher-private/public/index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    # Preserve/add other existing MAIN API modules here after route inspection.
    location / { return 404; }
}
