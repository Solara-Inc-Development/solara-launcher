# PREPARATION ONLY. Review/copy to sites-available after DNS + certificates exist.
# Do not enable this file automatically; no production services were modified.
server {
    listen 80;
    listen [::]:80;
    server_name app.solara-inc.in;
    location ^~ /.well-known/acme-challenge/ { root /var/www/solara-launcher-acme; }
    location / { return 301 https://app.solara-inc.in$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.solara-inc.in;
    ssl_certificate /etc/letsencrypt/live/app.solara-inc.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.solara-inc.in/privkey.pem;
    root /var/www/solara-launcher/dist;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.solara-inc.in https://api.modrinth.com; object-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /screenshots/ { expires 1h; }
    # Expose only immutable installers, signatures and vetted corresponding source archives.
    location ~ ^/builds/(V-0\.0\.[0-9]+/(?:solaralauncher\.exe(?:\.sig)?|source\.zip)|Solara-Launcher-V-0\.0\.[0-9]+\.exe(?:\.sig)?)$ {
        alias /var/www/solara-launcher/builds/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        default_type application/octet-stream;
    }
    location /builds/ { return 404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
}
